<div class="container mt-4">
  <h2 class="text-center mb-4">Eventos Disponibles</h2>

  <div class="card mx-auto" style="max-width: 600px;">
    
    <img [src]="eventos[indiceActual].img" 
         class="card-img-top" 
         alt="foto del evento"
         style="height: 300px; object-fit: cover;">

    <div class="card-body text-center">
      <h4 class="card-title">{{ eventos[indiceActual].nombre }}</h4>
      <p class="card-text">{{ eventos[indiceActual].descripcion }}</p>
    </div>

    <div class="card-footer d-flex justify-content-between align-items-center">
      <button class="btn btn-secondary" (click)="anterior()">Anterior</button>
      <span>{{ indiceActual + 1 }} / {{ eventos.length }}</span>
      <button class="btn btn-primary" (click)="siguiente()">Siguiente</button>
    </div>

  </div>
</div>
